[workspace]
resolver = "2"
members = [
    "crates/skotos-domain",
    "crates/skotos-eval",
    "crates/skotos-storage",
    "crates/skotos-auth",
    "crates/skotos-telemetry",
    "crates/skotos-fanout",
    "services/control-api",
    "services/delivery-edge",
    "services/event-ingest",
    "sdks/rust-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
repository = "https://github.com/sabiehahmed/skotos"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Internal workspace crates
skotos-domain = { path = "crates/skotos-domain" }
skotos-eval = { path = "crates/skotos-eval" }
skotos-storage = { path = "crates/skotos-storage" }
skotos-auth = { path = "crates/skotos-auth" }
skotos-telemetry = { path = "crates/skotos-telemetry" }
skotos-fanout = { path = "crates/skotos-fanout" }

# M2 (1B) — skotos-domain & skotos-eval
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
regex = "1"
sha1 = "0.10"
hex = "0.4"
semver = "1"
proptest = "1"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }

# M4 (1C) — skotos-storage, skotos-auth & control-api
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "limit"] }
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
dotenvy = "0.15"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rand = "0.8"
subtle = "2"
async-trait = "0.1"

# Phase 2 — fanout, delivery-edge, event-ingest & Rust SDK
async-nats = "0.38"
object_store = { version = "0.11", features = ["aws"] }
flate2 = "1"
zstd = "0.13"
bytes = "1"
futures = "0.3"
dashmap = "6"
