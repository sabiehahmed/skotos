name: "Skotos Code References"
description: "Scan repository for Skotos feature flag references, upload hunks to Skotos Control Plane, and enforce flag extinction checks in CI."
inputs:
  project-key:
    description: "Skotos project key"
    required: false
    default: "default"
  flags:
    description: "Comma-separated flag keys to scan"
    required: true
  check-extinction:
    description: "Optional flag key that must have zero references in the repository"
    required: false
    default: ""
  upload:
    description: "Upload scanned references to Skotos Control Plane"
    required: false
    default: "true"
  api-url:
    description: "Skotos Control Plane base URL"
    required: false
    default: "http://127.0.0.1:8080"
  api-token:
    description: "Skotos API access token (sk_api_...)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Run skotos-code-refs
      shell: bash
      env:
        SKOTOS_API_URL: ${{ inputs.api-url }}
        SKOTOS_API_TOKEN: ${{ inputs.api-token }}
      run: |
        ARGS=(--dir "${{ github.workspace }}" --flags "${{ inputs.flags }}" --project "${{ inputs.project-key }}" --repo "${{ github.repository }}" --branch "${{ github.ref_name }}" --commit "${{ github.sha }}")
        if [[ "${{ inputs.upload }}" == "true" && -n "${SKOTOS_API_TOKEN}" ]]; then
          ARGS+=(--upload)
        fi
        if [[ -n "${{ inputs.check-extinction }}" ]]; then
          ARGS+=(--check-extinction "${{ inputs.check-extinction }}")
        fi
        cargo run -p skotos-code-refs -- "${ARGS[@]}"
