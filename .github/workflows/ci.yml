name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust fmt, clippy & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: skotos
          POSTGRES_PASSWORD: skotos
          POSTGRES_DB: skotos
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U skotos -d skotos"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      CARGO_TERM_COLOR: always
      DATABASE_URL: postgres://skotos:skotos@127.0.0.1:5432/skotos
      NATS_URL: nats://127.0.0.1:4222
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: skotos-snapshots
      S3_ACCESS_KEY_ID: skotos
      S3_SECRET_ACCESS_KEY: skotos-dev-secret
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start NATS JetStream and MinIO for Phase 2 delivery E2E
        run: docker compose -f deploy/docker/docker-compose.dev.yml up -d --wait --wait-timeout 90 nats minio

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust workspace tests
        run: cargo test --workspace

  go-sdk:
    name: Go Server SDK golden suite & race tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go Server SDK tests (124 golden vectors + OpenFeature)
        run: go -C sdks/go-server test -v -race ./...

  frontend:
    name: TypeScript, ESLint boundaries, tests & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint and UI boundary rules
        run: pnpm lint

      - name: Run zero-Tailwind and manifest boundary guard
        run: pnpm lint:boundaries

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run boundary, SDK golden, and workspace unit tests
        run: pnpm test

      - name: Build workspace packages, SDKs, and web app
        run: pnpm build

  docs:
    name: Markdown lint & Prettier check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Markdown documentation
        run: pnpm run lint:md

      - name: Check documentation formatting
        run: pnpm run format:check
