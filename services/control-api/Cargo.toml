[package]
name = "control-api"
description = "Skotos Control Plane REST API and OpenAPI 3.1 exporter"
default-run = "control-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "control_api"
path = "src/lib.rs"

[[bin]]
name = "control-api"
path = "src/main.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"

[dependencies]
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
dotenvy.workspace = true
futures.workspace = true
http.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
skotos-auth.workspace = true
skotos-domain = { workspace = true, features = ["openapi"] }
skotos-eval.workspace = true
skotos-fanout = { workspace = true, features = ["workers"] }
skotos-storage.workspace = true
skotos-telemetry.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
uuid.workspace = true

[dev-dependencies]
base64.workspace = true
delivery-edge = { path = "../delivery-edge" }
event-ingest = { path = "../event-ingest" }
flate2.workspace = true
relay-proxy = { path = "../relay-proxy" }
reqwest.workspace = true
skotos-code-refs = { path = "../../tools/skotos-code-refs" }
skotos-mcp = { path = "../../tools/skotos-mcp" }
skotos-server-sdk = { path = "../../sdks/rust-server" }
zstd.workspace = true

[lints]
workspace = true
