[package]
name = "control-api"
description = "Skotos Control Plane REST API and OpenAPI 3.1 exporter"
default-run = "control-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "control_api"
path = "src/lib.rs"

[[bin]]
name = "control-api"
path = "src/main.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"

[dependencies]
axum.workspace = true
chrono.workspace = true
dotenvy.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
skotos-auth.workspace = true
skotos-domain = { workspace = true, features = ["openapi"] }
skotos-eval.workspace = true
skotos-storage.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
uuid.workspace = true

[lints]
workspace = true
