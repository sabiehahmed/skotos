[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skotos-server-sdk"
version = "0.1.0"
description = "Skotos Server-Side Python SDK with 100% golden evaluator parity, OpenFeature provider, and 2/4/6-stage migration flag helpers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["skotos_sdk*"]
